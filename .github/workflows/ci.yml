name: CapyHub CI/CD — Harness Validator, Doctor, Unit Tests & Production Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify-and-build:
    name: Inspector Capy Automated QA Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CapyHub Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Capybara Harness Plugin, 6 Subagents Frontmatter & 7 Max Skills
        run: npm run harness:validate

      - name: Run CapyHub Loop Doctor (Architecture, Security & Line-Limit Audit)
        run: npm run doctor

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Test Suite (Voice Loop, XState, Handoff QA & Zero-Sum Finance)
        run: npm test

      - name: Build Production Web Hub Bundle
        run: npm run build

      - name: Upload Built CapyHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: capyhub-web-dist
          path: dist/
          retention-days: 7
